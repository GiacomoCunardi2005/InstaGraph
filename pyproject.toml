[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instagraph"
version = "0.1.0"
description = "A local, persistent Instagram social-graph importer."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ai = ["openai>=2.45,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/instagraph"]
include = ["src/instagraph/web/**"]
dev-mode-exact = true
